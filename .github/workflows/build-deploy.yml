name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["apps/docs/**"]
    tags: ["v*"]
  # No paths-ignore here: the `changes` job skips e2e for docs-only PRs, and
  # the required checks `test` and `e2e` must report or the PR stays blocked.
  pull_request:
    branches: [main]
  # Nightly full run on main: e2e regardless of path filters, plus the
  # dependency audit. Deploy jobs only run on push, so this never deploys.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  # event_name keeps a nightly or manual run from cancelling a main deploy.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: opencoophq
  # actions/cache waits 10 minutes on a stalled download by default. A main
  # run on 2026-10-30 lost exactly that on the pnpm store. Give up sooner and
  # install from the registry instead.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  # Decides whether a PR needs e2e and the Docker builds, and which Playwright
  # specs a PR runs. Every other event (push to main, tags, nightly, manual)
  # always runs everything, including the full e2e suite.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.decide.outputs.app }}
      e2e_mode: ${{ steps.e2e-select.outputs.mode }}
      e2e_specs: ${{ steps.e2e-select.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # e2e/tests: the selector lists the specs and finds the @smoke ones.
          sparse-checkout: |
            .github/scripts
            e2e/tests
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "app=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rename lists its old path too, so the area it left still counts.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          echo "Changed files: $(wc -l < changed.txt)"
          bash .github/scripts/ci-changes.sh < changed.txt | tee -a "$GITHUB_OUTPUT"
      # PR e2e runs the @smoke spec files plus the specs mapped to the diff in
      # .github/scripts/e2e-path-map.txt. Any doubt gives mode=full.
      - id: e2e-select
        if: github.event_name == 'pull_request'
        run: |
          bash .github/scripts/e2e-select.sh < changed.txt > e2e-select.txt
          cat e2e-select.txt
          head -n 1 e2e-select.txt >> "$GITHUB_OUTPUT"
          echo "specs=$(tail -n +2 e2e-select.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CI and deploy scripts
        run: |
          bash deploy/remote-deploy.test.sh
          bash .github/scripts/ci-changes.test.sh
          bash .github/scripts/e2e-select.test.sh
      - id: setup
        uses: ./.github/actions/setup-workspace
      - name: Build workspace dependencies (shared, pdf-templates)
        run: pnpm --filter "@opencoop/api^..." build
      # Independent checks on a 4-vCPU runner: run them side by side.
      - name: Typecheck, lint, unit tests (parallel)
        run: |
          bash .github/scripts/run-parallel.sh \
            "typecheck-api=pnpm --filter @opencoop/api exec tsc --noEmit -p tsconfig.json" \
            "typecheck-web=pnpm --filter @opencoop/web exec tsc --noEmit" \
            "lint-api=pnpm --filter @opencoop/api lint" \
            "lint-web=pnpm --filter @opencoop/web lint" \
            "unit-api=pnpm --filter @opencoop/api exec jest --maxWorkers=2" \
            "unit-web=pnpm --filter @opencoop/web test"
      # Only main writes the pnpm store cache. PRs restore it from here.
      - name: Prune pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        run: pnpm store prune
      - name: Save pnpm store cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # Report-only, so it no longer runs on every PR (it cost 70-90s per run).
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependency audit (report only)
        run: pnpm audit --prod || true

  e2e:
    needs: changes
    # Fail open: if `changes` broke, its output is empty and e2e still runs.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: opencoop
          POSTGRES_PASSWORD: opencoop
          POSTGRES_DB: opencoop_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opencoop -d opencoop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace

      # Next.js reuses its build cache across runs. Keyed on web sources,
      # with fallbacks so a partial match still speeds up the build.
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/messages/**', 'packages/shared/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Only the two apps e2e serves (and what they depend on). `pnpm build`
      # also built the docs site, which e2e never uses.
      - name: Build API & Web
        run: pnpm exec turbo build --filter=@opencoop/api --filter=@opencoop/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Save Next.js build cache
        if: env.ON_MAIN == 'true' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Push schema to test DB
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://opencoop:opencoop@localhost:5433/opencoop_test

      - name: Seed test DB
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://opencoop:opencoop@localhost:5433/opencoop_test

      - name: Seed demo coop
        run: pnpm --filter @opencoop/database exec tsx prisma/seed-demo.ts
        env:
          DATABASE_URL: postgresql://opencoop:opencoop@localhost:5433/opencoop_test

      - name: Install e2e dependencies
        run: cd e2e && npm ci

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright (Chromium only)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd e2e && npx playwright install chromium --with-deps

      # Cached browsers still need their system libraries on a fresh runner.
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: cd e2e && npx playwright install-deps chromium

      - name: Save Playwright browsers
        if: env.ON_MAIN == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}

      # One Playwright run either way, so the web servers start once. In
      # select mode the setup project still runs: it is a dependency.
      - name: Run E2E tests
        run: |
          cd e2e
          if [ "$E2E_MODE" = "select" ] && [ -n "$E2E_SPECS" ]; then
            files=()
            for spec in $E2E_SPECS; do files+=("${spec#e2e/}"); done
            echo "E2E mode: select (${#files[@]} spec files)"
            printf '  %s\n' "${files[@]}"
            npx playwright test "${files[@]}"
          else
            echo "E2E mode: full suite"
            npx playwright test
          fi
        env:
          # Only a PR can select. Every other event, or a missing or broken
          # selection, runs the full suite.
          E2E_MODE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.e2e_mode || 'full' }}
          E2E_SPECS: ${{ needs.changes.outputs.e2e_specs }}
          CI: true
          DATABASE_URL: postgresql://opencoop:opencoop@localhost:5433/opencoop_test
          REDIS_URL: redis://localhost:6380
          JWT_SECRET: test-jwt-secret
          FRONTEND_URL: http://localhost:3002
          API_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_SECRET: test-nextauth-secret
          NEXTAUTH_URL: http://localhost:3002

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # One job per image, so the API and Migrate builds no longer wait behind
  # the Web build. `needs: build` in the deploy jobs waits for all three.
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile
          - image: web
            file: apps/web/Dockerfile
          - image: migrate
            file: deploy/migrate.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Every run reads main's layer cache; only main writes it. PR and tag
      # runs used to write their own copies (mode=max), which kept the repo
      # cache over its 10 GB limit and evicted main's layers.
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/opencoop-${{ matrix.image }}:${{ github.sha }}
          build-args: |
            ${{ matrix.image == 'web' && 'NEXT_PUBLIC_API_URL=/api' || '' }}
            ${{ matrix.image == 'web' && format('NEXT_PUBLIC_SENTRY_DSN={0}', secrets.NEXT_PUBLIC_SENTRY_DSN) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

  deploy-acc:
    needs: [build, e2e, test]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: acc
    steps:
      - name: Check out deploy script
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to acc
        uses: ./.github/actions/remote-deploy
        with:
          host: fsn1
          username: wouter
          ssh_key: ${{ secrets.FSN1_SSH_KEY }}
          deploy_dir: acc
          env_key: TAG
          pull_services: migrate api web
          up_services: migrate api web
          verify: api:running web:running migrate:exited0
          health_url: https://acc.opencoop.be/api/health

  deploy-prod:
    needs: [build, e2e, test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out deploy script
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to prod
        uses: ./.github/actions/remote-deploy
        with:
          host: fsn1
          username: wouter
          ssh_key: ${{ secrets.FSN1_SSH_KEY }}
          deploy_dir: prod
          env_key: TAG
          pull_services: migrate api web
          up_services: migrate api web
          verify: api:running web:running migrate:exited0
          health_url: https://opencoop.be/api/health
